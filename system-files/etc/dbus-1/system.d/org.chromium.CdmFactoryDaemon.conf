<busconfig>
  <policy user="cdm-oemcrypto">
    <allow own="org.chromium.CdmFactoryDaemon" />
  </policy>
  <policy user="chronos">
    <!-- methods allowed -->
    <allow send_destination="org.chromium.CdmFactoryDaemon"
           send_interface="org.chromium.CdmFactoryDaemon"
           send_member="BootstrapCdmFactoryDaemonMojoConnection" />
  </policy>
  <policy user="root">
    <!-- methods allowed -->
    <allow send_destination="org.chromium.CdmFactoryDaemon"
           send_interface="org.chromium.CdmFactoryDaemon"
           send_member="GetFactoryTransportKeyMaterial" />
    <allow send_destination="org.chromium.CdmFactoryDaemon"
           send_interface="org.chromium.CdmFactoryDaemon"
           send_member="WrapFactoryKeybox" />
    <allow send_destination="org.chromium.CdmFactoryDaemon"
           send_interface="org.chromium.CdmFactoryDaemon"
           send_member="GetClientInformation" />
    <allow send_destination="org.chromium.CdmFactoryDaemon"
           send_interface="org.chromium.CdmFactoryDaemon"
           send_member="GetBootCertificateChain" />
  </policy>
</busconfig>
