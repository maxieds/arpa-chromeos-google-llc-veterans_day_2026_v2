description      "OemCrypto and CDM daemon for Widevine L1"
author           "chromium-os-dev@chromium.org"

# Starts the cdm-oemcrypto daemon which provides a Widevine L1 DRM OEMCrypto
# implementation for use in ARC as well as a CDM service to Chrome which also
# uses the underlying OEMCrypto implementation. For ARC, this is done by having
# an implementation of liboemcrypto.so in Android which uses ArcBridge to
# connect to Chrome which then forwards that connection to the cdm-oemcrypto
# daemon. For the CDM, this is connected to directly from Chrome.
start on started ui
stop on stopping ui

# Respawn the daemon on crashes. Failure to do remote provisioning will cause it
# to crash, so we need to retry in case it was due to a networking or other
# transient issue. Sometimes devices can't provision sucessfully due to the
# server config not supporting them, and it can take up to 15 seconds to get
# through that process. We stop if there are 5 respawns in 90 seconds to avoid
# log spam in that case.
respawn
respawn limit 5 90

# We can be restarted and recover, worst case a user will need to reload a web
# page when that happens or restart playback of a media session.
oom score -100

pre-start script
  # Create the directory we use for storing sensitive data and set proper
  # permissions and ownership for it.
  mkdir -p -m 0700 /var/lib/oemcrypto
  chown cdm-oemcrypto:cdm-oemcrypto /var/lib/oemcrypto

  # Extract the wrapped Widevine keybox from VPD and write it to the filesystem.
  # This is only used on AMD platforms, delete it if it's empty.
  vpd_get_value widevine_keybox > /var/lib/oemcrypto/wrapped_amd_keybox.hex
  if [ -s /var/lib/oemcrypto/wrapped_amd_keybox.hex ]; then
    chown cdm-oemcrypto:cdm-oemcrypto /var/lib/oemcrypto/wrapped_amd_keybox.hex
  else
    rm /var/lib/oemcrypto/wrapped_amd_keybox.hex
  fi
end script

script
  if grep -q '^CHROMEOS_RELEASE_TRACK=test' /etc/lsb-release; then
    OEMCRYPTO_ARGS="--allow_dev_mode --provision_test_credentials"
  else
    OEMCRYPTO_ARGS=""
  fi

  EXTRA_MINIJAIL_ARGS=""

  # Start constructing minijail0 args...
  args=""

  # Enter a new mount namespace.
  args="${args} -v"

  # Mark all existing mounts as slave mode.
  args="${args} -Kslave"

  # Use a minimalistic mount namespace.
  args="${args} --profile minimalistic-mountns"

  # Enter a new IPC namespace.
  args="${args} -l"

  # Enter a new PID namespace.
  args="${args} -p"

  # Enter a new UTS namespace.
  args="${args} --uts"

  # Drop all capabilities and don't allow any new privileges.
  args="${args} -c 0 -n"

  # Change user/group to cdm-oemcrypto.
  args="${args} -u cdm-oemcrypto -g cdm-oemcrypto"

  # Inherit supplementary groups (video).
  args="${args} -G"

  # Set up mount points.
  args="${args} -b /sys"
  args="${args} -k tmpfs,/run,tmpfs,MS_NOSUID|MS_NODEV|MS_NOEXEC"
  args="${args} -k /run/daemon-store/cdm-oemcrypto,/run/daemon-store/cdm-oemcrypto,none,MS_BIND|MS_REC"
  args="${args} -b /run/dbus"
  args="${args} -b /run/shill"
  args="${args} -k tmpfs,/var,tmpfs,MS_NOSUID|MS_NODEV|MS_NOEXEC"
  args="${args} -b /var/lib/oemcrypto,/var/lib/oemcrypto,1"
  args="${args} -b /dev/log"
  args="${args} -b /run/chromeos-config/v1"
  args="${args} -b /run/dns-proxy"

  # Add additional arguments dynamically injected by the associated ebuild.
  args="${args} ${EXTRA_MINIJAIL_ARGS}"

  # Set up seccomp-bpf.
  args="${args} -S /usr/share/policy/cdm-oemcrypto-seccomp.policy"

  # Finally, specify the command line arguments and check to see if we need to
  # run the alternate cdm-oemcrypto binary instead which happens when the FW
  # version is compatible on Intel devices.
  if [ -f "/var/lib/oemcrypto/wv16_fw_version_invalid" ]; then
    args="${args} -- /usr/sbin/cdm-oemcrypto-wv14 ${OEMCRYPTO_ARGS}"
  else
    args="${args} -- /usr/sbin/cdm-oemcrypto ${OEMCRYPTO_ARGS}"
  fi

  exec minijail0 ${args}
end script
