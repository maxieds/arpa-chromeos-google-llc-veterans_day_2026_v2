description "mount/unmount Google text-to-speech (TTS) squashfs file"
author "chromium-os-dev@chromium.org"

start on started ui
stop on stopped ui

# This is extremely unlikely to run out of memory.
oom score -100

env TTS_ROOT="/usr/share/chromeos-assets/speech_synthesis"

pre-start script
  LOOP_DEV=$(losetup --direct-io=on -r -f --show "${TTS_ROOT}/patts.squash")
  mount -o ro,nodev,nosuid "${LOOP_DEV}" "${TTS_ROOT}/patts/"
end script

post-stop script
  umount "${TTS_ROOT}/patts"

  LOOP_DEV=$(losetup -j "${TTS_ROOT}/patts.squash")
  LOOP_DEV="${LOOP_DEV%%:*}"
  losetup -d "${LOOP_DEV}"
end script
