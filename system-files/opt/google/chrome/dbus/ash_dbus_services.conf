<!DOCTYPE busconfig
  PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="chronos">
    <allow own="org.chromium.DisplayService" />
  </policy>

  
  <policy user="power">
    <allow send_destination="org.chromium.DisplayService" send_interface="org.chromium.DisplayServiceInterface" />
  </policy>

  
  <policy user="root">
    <allow send_destination="org.chromium.DisplayService" send_interface="org.chromium.DisplayServiceInterface" />
  </policy>
<policy user="chronos">
    <allow own="org.chromium.GesturePropertiesService" />
  </policy>

  <policy user="chronos">
    <allow send_destination="org.chromium.GesturePropertiesService" send_interface="org.chromium.GesturePropertiesServiceInterface" />
  </policy>

<policy user="chronos">
    <allow own="org.chromium.LivenessService" />
  </policy>

  
  <policy user="root">
    <allow send_destination="org.chromium.LivenessService" send_interface="org.chromium.LivenessServiceInterface" />
  </policy>

  
  <policy user="session_manager">
    <allow send_destination="org.chromium.LivenessService" send_interface="org.chromium.LivenessServiceInterface" />
  </policy>

<policy user="chronos">
    <allow own="org.chromium.PrivacyScreenService" />
  </policy>

  
  <policy user="power">
    <allow send_destination="org.chromium.PrivacyScreenService" send_interface="org.chromium.PrivacyScreenService" />
  </policy>

  
  <policy user="root">
    <allow send_destination="org.chromium.PrivacyScreenService" send_interface="org.chromium.PrivacyScreenService" />
  </policy>
<policy user="chronos">
    <allow own="org.chromium.UrlHandlerService" />
  </policy>
  <policy user="vm_cicerone">
    
    <allow send_destination="org.chromium.UrlHandlerService" send_interface="org.chromium.UrlHandlerServiceInterface" send_member="OpenUrl" />
  </policy>
  <policy user="ferrochromed">
    
    <allow send_destination="org.chromium.UrlHandlerService" send_interface="org.chromium.UrlHandlerServiceInterface" send_member="OpenUrl" />
  </policy>
<policy user="chronos">
    <allow own="org.chromium.UserAuthenticationService" />
  </policy>

  
  <policy user="u2f">
    <allow send_destination="org.chromium.UserAuthenticationService" send_interface="org.chromium.UserAuthenticationServiceInterface" />
  </policy>
</busconfig>