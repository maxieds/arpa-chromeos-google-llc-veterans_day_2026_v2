<!DOCTYPE busconfig
  PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="chronos">
    <allow own="org.chromium.ArcCrosh" />
  </policy>

  
  <policy user="root">
    <allow send_destination="org.chromium.ArcCrosh" send_interface="org.chromium.ArcCrosh" />
  </policy>
<policy user="chronos">
    <allow own="org.chromium.ArcTracing" />
    <allow receive_sender="org.chromium.ArcTracing" receive_interface="org.chromium.ArcTracing" />
    <allow send_destination="org.chromium.ArcTracing" send_interface="org.chromium.ArcTracing" />
  </policy>
<policy user="chronos">
